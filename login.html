<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | KiNutri</title>

  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>

  <main class="auth-page">
    <div class="auth-card">
      <a href="index.html" class="auth-logo">KiNutri</a>
      <p class="auth-subtitle">Entre na sua conta para continuar</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">E-mail</label>
          <input type="email" id="loginEmail" placeholder="seuemail@gmail.com" required>
        </div>

        <div class="form-group">
          <label for="loginSenha">Senha</label>
          <input type="password" id="loginSenha" placeholder="Digite sua senha" required>
        </div>

        <button type="submit" class="btn btn-primary" id="loginBtn">
          Entrar
        </button>
      </form>

      <div class="auth-footer">
        Não tem conta?
        <a href="cadastro.html">Cadastre-se</a>
      </div>
    </div>
  </main>

  <div class="toast" id="toast"></div>
<script src="assets/js/storage.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/theme.js"></script>

</body>
</html>
