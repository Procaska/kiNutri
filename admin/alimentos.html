<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alimentos | KiNutri Admin</title>
  <link rel="stylesheet" href="../assets/css/images.css">

  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>

<body onload="protegerRota('admin')">

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a href="admin.html" class="admin-logo">KiNutri Admin</a>

      <nav class="admin-menu">
        <a href="admin.html">Dashboard</a>
        <a href="usuarios.html">Usuários</a>
        <a href="planos.html">Planos</a>
        <a href="alimentos.html" class="active">Alimentos</a>
        <a href="faqs.html">FAQs</a>

        <button class="theme-toggle" onclick="toggleTheme()">
          🌙 Modo escuro
        </button>

        <button onclick="logout()">Sair</button>
      </nav>
    </aside>

    <main class="admin-main">
      <section class="admin-topbar">
        <button class="admin-mobile-btn" onclick="toggleSidebar()">
          ☰
        </button>

        <h1>Gerenciar Alimentos</h1>
        <p>Cadastre alimentos para usar nos planos alimentares.</p>
      </section>

      <section class="admin-section">
        <form id="alimentoForm" class="admin-form">
          <input type="text" id="alimentoNome" placeholder="Nome do alimento" required>
          <input type="text" id="alimentoCategoria" placeholder="Categoria" required>
          <input type="number" id="alimentoCalorias" placeholder="Calorias" required>
          <input type="number" id="alimentoProteina" placeholder="Proteína">

          <button class="btn btn-primary" type="submit">
            Criar alimento
          </button>
        </form>

        <input
          type="text"
          id="searchAlimentos"
          placeholder="Pesquisar alimentos..."
          class="search-input"
        />

        <div class="table-wrapper">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Alimento</th>
                <th>Categoria</th>
                <th>Calorias</th>
                <th>Proteína</th>
                <th>Ações</th>
              </tr>
            </thead>

            <tbody id="alimentosTable">
              <tr id="alimentosLoading">
                <td colspan="5" class="loading-state">
                    Carregando alimentos...
    </td>
  </tr>
</tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

<dialog id="foodGallery" aria-labelledby="foodGalleryTitle" class="image-dialog image-panel">
  <header>
    <h2 id="foodGalleryTitle">Galeria de imagens</h2>
    <button id="foodGalleryClose" type="button" class="btn btn-outline">Fechar</button>
  </header>
  <form enctype="multipart/form-data">
    <label for="foodImageFile">Selecionar imagem</label>
    <input id="foodImageFile" name="image" type="file" accept="image/jpeg,image/png,image/webp" required>
    <small>JPEG, PNG ou WebP, até 5 MiB. Envie uma imagem por vez.</small>
    <label for="foodImageAlt">Texto alternativo (opcional)</label>
    <input id="foodImageAlt" name="alt_text" type="text" maxlength="255" placeholder="Ex.: fatias de maçã vermelha">
    <img id="foodImagePreview" class="image-preview" alt="Prévia da imagem selecionada" hidden>
    <button type="submit" class="btn btn-primary">Adicionar imagem</button>
  </form>
  <p id="foodGalleryStatus" class="image-status" role="status"></p>
  <button id="foodGalleryRetry" class="btn btn-outline" type="button" hidden>Tentar carregar novamente</button>
  <div id="foodGalleryItems" class="image-gallery"></div>
</dialog>

<script src="../assets/js/storage.js"></script>
<script src="../assets/js/common/classes/EntityValidation.js"></script>
<script src="../assets/js/common/classes/User.js"></script>
<script src="../assets/js/common/classes/Food.js"></script>
<script src="../assets/js/common/classes/UserProfile.js"></script>
<script src="../assets/js/common/classes/DietFood.js"></script>
<script src="../assets/js/common/classes/Diet.js"></script>
<script src="../assets/js/common/classes/HttpClientBase.js"></script>
<script src="../assets/js/common/services/UserService.js"></script>
<script src="../assets/js/common/services/FoodService.js"></script>
<script src="../assets/js/common/services/DietService.js"></script>
<script src="../assets/js/common/prototypes/ToastPrototype.js"></script>
<script src="../assets/js/common/prototypes/FormControllerPrototype.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/notificacoes.js"></script>
<script src="../assets/js/alimentos.js"></script>
<script src="../assets/js/common/services/ImageService.js"></script>
<script src="../assets/js/image-form.js"></script>
<script src="../assets/js/food-gallery.js"></script>
</body>
</html>
