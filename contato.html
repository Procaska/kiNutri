<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato | KiNutri</title>

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

  <header class="navbar">
    <div class="container navbar-content">
      <a href="index.html" class="logo">KiNutri</a>

      <nav class="nav-links">
        <a href="index.html">Início</a>
        <a href="sobre.html">Sobre</a>
        <a href="faqs.html">FAQs</a>
        <a href="contato.html">Contato</a>
          <button class="btn btn-outline theme-toggle" onclick="toggleTheme()">
    🌙 Modo escuro
  </button>
        <a href="login.html">Entrar</a>
        <a href="cadastro.html" class="btn btn-primary">Criar conta</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="section-title">
        <h2>Entre em contato</h2>
        <p>Envie uma mensagem para a equipe KiNutri.</p>
      </div>

      <div class="auth-card" style="margin: 0 auto;">
        <form onsubmit="event.preventDefault(); alert('Mensagem enviada com sucesso!'); this.reset();">
          <div class="form-group">
            <label>Nome</label>
            <input type="text" placeholder="Seu nome" required>
          </div>

          <div class="form-group">
            <label>E-mail</label>
            <input type="email" placeholder="seuemail@gmail.com" required>
          </div>

          <div class="form-group">
            <label>Mensagem</label>
            <input type="text" placeholder="Digite sua mensagem" required>
          </div>

          <button class="btn btn-primary" type="submit">Enviar mensagem</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>© 2026 KiNutri. Todos os direitos reservados.</p>
  </footer>

  <script src="assets/js/theme.js"></script>

</body>
</html>
